<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprovante de Abastecimento</title>
</head>
<body>

    <div class="receipt-card">
        <div class="receipt-header">
            <h1>Relatório de Abastecimento</h1>
            <p>Posto de Combustíveis</p>
        </div>
        
        <div class="receipt-body">
            <div class="info-group">
                <span class="label">Data e Hora:</span>
                <span class="value" id="dataHora">-</span>
            </div>
            <div class="info-group">
                <span class="label">Modelo:</span>
                <span class="value" id="modelo">-</span>
            </div>
            <div class="info-group">
                <span class="label">Placa:</span>
                <span class="value" id="placa">-</span>
            </div>
            <div class="info-group">
                <span class="label">Combustível:</span>
                <span class="value" id="combustivel">-</span>
            </div>
            <div class="info-group">
                <span class="label">Valor do Litro:</span>
                <span class="value" id="valorLitro">-</span>
            </div>
            <div class="info-group">
                <span class="label">Quantidade:</span>
                <span class="value" id="qtdLitros">-</span>
            </div>

            <div class="total-box">
                <div class="total-row">
                    <span class="total-label">Total a Pagar:</span>
                    <span class="total-value" id="valorTotal">-</span>
                </div>
                <div class="tax-note" id="imposto">
                    Observação: Valor do Imposto (25%): R$ 0,00
                </div>
            </div>
        </div>

        <div class="receipt-footer">
            <button class="btn-reload" onclick="location.reload()">Novo Abastecimento</button>
        </div>
    </div>

    <script>
       
        let modelo = prompt("Informe o modelo do veículo:");

        let placa = prompt("Informe a placa do veículo:");

        let tipoCombustivel = prompt("Informe o tipo de combustível (ETANOL ou GASOLINA):");
        
        let valorLitro = parseFloat(prompt("Informe o valor do litro (em R$):").replace(",", "."));

        let qtdLitros = parseFloat(prompt("Informe a quantidade de litros abastecida:").replace(",", "."));

        let valorTotal = valorLitro * qtdLitros;

        let imposto = valorTotal * 0.25;

        let agora = new Date();
        
        let dataHoraFormatada = agora.toLocaleString("pt-BR");

        function formatarMoeda(valor) {
            return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
        }

        document.getElementById("dataHora").innerText = dataHoraFormatada;
        document.getElementById("modelo").innerText = modelo || "Não informado";
        document.getElementById("placa").innerText = (placa || "Não informada").toUpperCase();
        document.getElementById("combustivel").innerText = (tipoCombustivel || "Não informado").toUpperCase();
        document.getElementById("valorLitro").innerText = formatarMoeda(valorLitro);
        document.getElementById("qtdLitros").innerText = qtdLitros.toFixed(2) + " L";
        document.getElementById("valorTotal").innerText = formatarMoeda(valorTotal);
        document.getElementById("imposto").innerText = "Observação: Valor do Imposto (25%): " + formatarMoeda(imposto);
    </script>

</body>
</html>
